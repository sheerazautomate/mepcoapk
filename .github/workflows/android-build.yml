name: Build and Release Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
  permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Deploy Convex Functions
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: npx convex deploy -y

      - name: Configure Convex URL
        if: ${{ vars.CONVEX_URL != '' }}
        run: |
          echo "window.CONVEX_URL = \"${{ vars.CONVEX_URL }}\";" > www/convex-config.js

      - name: Initialize Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Zipalign and Sign APK
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app-release-aligned.apk
          SIGNED=mepco-electric-dashboard.apk

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify "$SIGNED"

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: mepco-electric-dashboard.apk
          body: Automated signed build from commit ${{ github.sha }}
